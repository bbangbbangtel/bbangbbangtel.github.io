<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>고객후기 관리 | 휴대폰싸게파는사람들</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="topbar"><div class="container"><span>고객후기 관리자</span><span>휴대폰싸게파는사람들</span></div></div>
  <header><div class="container nav"><a class="logo" href="index.html">휴대폰<span>싸게파는사람들</span></a><a class="btn" href="reviews.html">후기 페이지 보기</a></div></header>
  <main>
    <section class="page-hero"><div class="container"><div class="breadcrumbs">홈 › 고객후기 관리</div><span class="badge">대표님 전용</span><h1>고객후기 관리</h1><p class="lead">고객이 접수한 후기를 확인하고 공개하거나, 좋은 판매 사례를 직접 등록할 수 있습니다.</p></div></section>
    <section class="section"><div class="container">
      <div class="admin-panel">
        <h2 style="font-size:26px">관리자 확인</h2>
        <form data-admin-login><div class="field"><label for="admin-password">관리 비밀번호</label><input id="admin-password" type="password" name="adminPassword" required autocomplete="current-password"></div><button class="btn primary" type="submit" style="margin-top:16px">관리 시작</button></form>
      </div>
      <div class="form-status" data-admin-status role="status"></div>
      <div data-admin-workspace hidden>
        <div class="admin-panel">
          <h2 style="font-size:26px">대표님 후기 직접 등록</h2>
          <form data-admin-create class="review-form" style="border:0;padding:0">
            <div class="form-grid">
              <div class="field"><label>고객 표시명</label><input name="name" maxlength="20" required placeholder="예: 김○○"></div>
              <div class="field"><label>별점</label><select name="rating"><option value="5">★★★★★ 5점</option><option value="4">★★★★☆ 4점</option><option value="3">★★★☆☆ 3점</option></select></div>
              <div class="field"><label>이용 서비스</label><select name="category" required><option>휴대폰</option><option>인터넷+TV</option><option>선불폰</option><option>중고폰</option><option>액세서리</option><option>기타상담</option></select></div>
              <div class="field"><label>구매기종·상품</label><input name="product" maxlength="50" placeholder="예: 아이폰 18 프로"></div>
              <div class="field"><label>통신사</label><select name="carrier"><option value="">해당 없음</option><option>SKT</option><option>KT</option><option>LG U+</option><option>알뜰폰</option></select></div>
              <div class="field"><label>가입유형</label><select name="activationType"><option value="">해당 없음</option><option>신규가입</option><option>번호이동</option><option>기기변경</option><option>중고폰 매입</option><option>상담</option></select></div>
              <div class="field full"><label>후기 제목</label><input name="title" maxlength="60" required></div>
              <div class="field full"><label>후기 내용</label><textarea name="content" minlength="10" maxlength="1000" required></textarea></div>
            </div>
            <button class="btn primary" type="submit" style="margin-top:18px">바로 공개하기</button>
          </form>
        </div>
        <div class="admin-panel"><h2 style="font-size:26px">고객 작성 후기 검토</h2><div class="pending-list" data-pending-list></div></div>
      </div>
    </div></section>
  </main>
  <footer><div class="container"><div class="footer-bottom"><small>© <span data-year></span> 휴대폰싸게파는사람들</small></div></div></footer>
  <script src="assets/config.js"></script><script src="assets/script.js"></script><script src="assets/review-admin.js"></script>
</body>
</html>
